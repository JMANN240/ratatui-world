[package]
name = "ratatui-world"
description = "A 3D world for your 2D terminal"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/JMANN240/ratatui-world"

[dependencies]
bvh = "0.12.0"
bytemuck = "1.25.0"
chrono = "0.4.43"
flume = "0.12.0"
glam = { version = "0.31.0", features = ["bytemuck"] }
gltf = "1.4.1"
itertools = "0.14.0"
megacache = { path = "../megacache" }
nalgebra = "0.34.1"
rand = "0.9.2"
ratatui-canvas-polygon = { path = "../ratatui-canvas-polygon" }
ratatui-core = "0.1.0"
ratatui-widgets = "0.3.0"
rayon = "1.11.0"
stl = "0.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
wgpu = { version = "27.0.1", features = ["spirv"] }

[dev-dependencies]
crossterm = "0.29.0"
rand = "0.9.2"
ratatui = "0.30.0"
tokio = { version = "1.49.0", features = ["full"] }
